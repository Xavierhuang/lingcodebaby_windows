# Cross-platform release: builds signed Windows (x64 + arm64) and Linux
# (deb/rpm/AppImage) bundles, then publishes a GitHub Release with a merged
# updater manifest (latest.json).
#
# Every job first freezes the bundled Quinny CLI (PyInstaller) into
# src-tauri/binaries/quinny/ so tauri-action ships it inside the installer.
# Windows arm64 reuses the x64-frozen quinny.exe (WoA runs x64 under emulation
# — PyInstaller can't cross-freeze to native arm64 from an x64 runner).
#
# Assumes this repo's root contains the Tauri app (package.json + src-tauri/).
# If the app lives in a subfolder, set `projectPath` on the tauri-action step.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.lingcodebaby-updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  the key password (lcb-updater-2026)
# GITHUB_TOKEN is provided automatically.
#
# Optional repo secret:
#   QUINNY_SOURCE_REPO  git URL of a Quinny fork carrying the WAF-neutral UA
#                       + ANTHROPIC_AUTH_TOKEN patches (see
#                       src-tauri/binaries/quinny/README.md). Empty →
#                       `pip install quinny` from PyPI, which is only safe
#                       once those patches land upstream.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # One job makes the draft release before any build starts. With three build
  # jobs racing "find or create a draft for this tag", two of them created
  # separate drafts in the same second (v1.3.0, 2026-09-25): Linux assets on
  # one, both Windows installers on the other, and a latest.json on each that
  # knew only its own platforms. Creating it once and handing the id to every
  # build job makes tauri-action upload into a single release and merge the
  # updater manifest across platforms.
  create-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Create (or reuse) the draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(jq -r .version src-tauri/tauri.conf.json)"
          fi
          # A draft cannot be looked up by tag, so scan the release list.
          ID=$(gh api "repos/${{ github.repository }}/releases?per_page=50" \
               --jq ".[] | select(.tag_name==\"$TAG\" and .draft==true) | .id" | head -1)
          if [ -z "$ID" ]; then
            ID=$(gh api -X POST "repos/${{ github.repository }}/releases" \
                 -f tag_name="$TAG" -f name="LingCodeBaby $TAG" \
                 -f body="See the assets to download and install." \
                 -F draft=true -F prerelease=false --jq .id)
            echo "created draft $TAG (id $ID)"
          else
            echo "reusing draft $TAG (id $ID)"
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    permissions:
      contents: write
    # Promote secrets to job env so `if:` conditions can gate on them.
    # (GitHub Actions doesn't allow direct `secrets.*` refs inside if-expressions.)
    env:
      QUINNY_SOURCE_REPO: ${{ secrets.QUINNY_SOURCE_REPO }}
      # Claude Code CLI shipped inside the Windows installers (npm platform
      # package @anthropic-ai/claude-agent-sdk-win32-<arch>). Bump to ship a
      # newer CLI; see src-tauri/binaries/claude/README.md.
      CLAUDE_SDK_VERSION: "0.3.282"
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04           # Linux x64 (.deb / .rpm / AppImage)
            args: ""
            rust-targets: ""
          - platform: windows-latest         # Windows x64 (NSIS)
            args: "--target x86_64-pc-windows-msvc"
            rust-targets: "x86_64-pc-windows-msvc"
            claude-arch: "x64"
          - platform: windows-latest         # Windows arm64 (NSIS)
            args: "--target aarch64-pc-windows-msvc"
            rust-targets: "aarch64-pc-windows-msvc"
            claude-arch: "arm64"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            build-essential curl wget file libxdo-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # --- Bundled Quinny CLI --------------------------------------------------
      # Freeze quinny with PyInstaller natively per platform so tauri-action
      # can pick it up via bundle.resources. This adds ~2 min to each job but
      # keeps the shipped installer self-contained (no `pip install quinny`
      # for the end user).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Quinny source (optional patched fork)
        if: ${{ env.QUINNY_SOURCE_REPO != '' }}
        shell: bash
        run: |
          git clone --depth 1 "$QUINNY_SOURCE_REPO" "$RUNNER_TEMP/quinny-src"
          echo "QUINNY_SOURCE=$RUNNER_TEMP/quinny-src" >> "$GITHUB_ENV"

      - name: Build Quinny (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          # PyInstaller can't cross-freeze to arm64 from x64 runners — the
          # x64 quinny.exe runs under Windows-on-ARM's x64 emulation. Both
          # matrix entries just freeze x64 and bundle the same binary.
          pwsh -File scripts/build-quinny-windows.ps1

      - name: Fetch Claude Code CLI (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          # Each Windows job fetches its own architecture, so arm64 runs native.
          pwsh -File scripts/fetch-claude-windows.ps1 -Arch ${{ matrix.claude-arch }}

      - name: Build Quinny (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          bash scripts/build-quinny-linux.sh

      - name: Build + publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # projectPath: "."          # set if the app is in a subfolder
          # Upload into the draft create-release made; tauri-action merges each
          # platform into the one latest.json already on that release.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}
