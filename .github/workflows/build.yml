# CI build — produces an installable Windows .exe on every push to main and on
# every pull request, and attaches it as a downloadable workflow artifact.
#
# This is NOT the release path. release.yml still owns tagging, signing and
# publishing; it stays on `tags: ["v*"]` so cutting a release remains a
# deliberate act. Think of this as "does it still build, and give me something I
# can install and click through".
#
# WHY THE --config OVERRIDE: tauri.conf.json sets bundle.createUpdaterArtifacts
# to true, so after bundling the CLI tries to sign the installer for the updater
# feed and fails with "A public key has been found, but no private key" unless
# TAURI_SIGNING_PRIVATE_KEY is set. A CI smoke build has no business handling the
# release signing key, so we merge that flag off instead. The .exe is identical;
# only the .sig updater artifact is skipped. Release builds still sign, because
# release.yml passes the real secrets.
#
# NOT DONE HERE: freezing the bundled Quinny CLI (PyInstaller, ~2 min/job — see
# release.yml). Without it src-tauri/binaries/quinny holds only its README, the
# resources glob matches nothing executable, and the app runs with Quinny
# unavailable — which the code already treats as a supported no-op. Shipped
# installers must come from release.yml, which does freeze it.

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # Fast failure ahead of the ~10-minute Rust build. `tauri build` runs
      # `npm run build` (tsc --noEmit && vite build) itself via
      # beforeBuildCommand, but finding out about a type error 30 seconds in
      # beats finding out after a full release-profile compile.
      - name: Typecheck + bundle frontend
        run: npm run build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build installer
        shell: bash
        run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LingCodeBaby-windows-x64-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
